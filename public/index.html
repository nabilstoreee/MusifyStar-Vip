    <script>
        // Immediate Theme Recovery Shield (Runs synchronously before first paint)
        (function() {
            try {
                var raw = localStorage.getItem('musifystar_app_settings');
                var parsed = raw ? JSON.parse(raw) : null;
                var backupRaw = localStorage.getItem('musifystar_theme_backup');
                var backup = backupRaw ? JSON.parse(backupRaw) : null;
                var cookieHome = null, cookieNav = null;
                try {
                    var mH = document.cookie.match(/(?:^|;\s*)musify_home_theme=([^;]+)/);
                    if (mH && mH[1]) cookieHome = decodeURIComponent(mH[1]);
                    var mN = document.cookie.match(/(?:^|;\s*)musify_nav_theme=([^;]+)/);
                    if (mN && mN[1]) cookieNav = decodeURIComponent(mN[1]);
                } catch(ce) {}

                var homeTheme = (parsed && parsed.homeTheme) || (backup && backup.homeTheme) || cookieHome || 'classic';
                var navTheme = (parsed && parsed.navTheme) || (backup && backup.navTheme) || cookieNav || 'classic';

                ['classic', 'playful', 'neon', 'spotify', 'apple'].forEach(function(th) {
                    document.documentElement.classList.remove('theme-home-' + th);
                });
                document.documentElement.classList.add('theme-home-' + homeTheme);

                ['classic', 'liquid', 'spotify', 'apple', 'neon', 'newclassic'].forEach(function(th) {
                    document.documentElement.classList.remove('theme-nav-' + th);
                });
                document.documentElement.classList.add('theme-nav-' + navTheme);
            } catch(e) {}
        })();

        // Universal Shield for HTMLMediaElement.prototype.currentTime to eliminate non-finite TypeError
        (function() {
            try {
                if (typeof HTMLMediaElement !== 'undefined' && HTMLMediaElement.prototype) {
                    var proto = HTMLMediaElement.prototype;
                    var descriptor = Object.getOwnPropertyDescriptor(proto, 'currentTime');
                    if (descriptor && descriptor.set) {
                        var originalSet = descriptor.set;
                        Object.defineProperty(proto, 'currentTime', {
                            get: descriptor.get,
                            set: function(val) {
                                var num = Number(val);
                                if (typeof num === 'number' && Number.isFinite(num) && !isNaN(num) && num >= 0) {
                                    try {
                                        originalSet.call(this, num);
                                    } catch (err) {}
                                }
                            },
                            configurable: true,
                            enumerable: descriptor.enumerable
                        });
                    }
                }
            } catch (e) {}
        })();
        if ('caches' in window) {
            try {
                caches.keys().then(function(keys) {
                    keys.forEach(function(k) {
                        if ((k.indexOf('MusifyStar-static-') === 0 && k !== 'MusifyStar-static-v102') ||
                            (k.indexOf('MusifyStar-api-') === 0 && k !== 'MusifyStar-api-v102')) {
                            caches.delete(k);
                        }
                    });
                });
            } catch (e) {}
        }
        if ('serviceWorker' in navigator) {
            // Hindari double-reload: catat apakah halaman saat load sudah dikontrol Service Worker
            var hadController = !!navigator.serviceWorker.controller;
            window._isReloadingApp = false;

            // Kunci anti-double-reload beruntun (minimal jeda 5 detik antar reload)
            window.reloadAppSafely = function(reason) {
                if (window._isReloadingApp || window.musifyAuthInProgress) return;
                try {
                    var lastLock = sessionStorage.getItem('musify_reload_lock');
                    if (lastLock && (Date.now() - parseInt(lastLock, 10)) < 5000) {
                        return; // Blokir reload kedua jika baru saja reload dalam 5 detik
                    }
                    sessionStorage.setItem('musify_reload_lock', String(Date.now()));
                } catch(e){}

                window._isReloadingApp = true;
                console.log('[PWA] Memuat ulang aplikasi 1x dengan aman. Alasan:', reason);
                window.location.reload();
            };

            navigator.serviceWorker.addEventListener('controllerchange', function() {
                // Jika halaman baru pertama kali diklaim oleh SW (bukan update), JANGAN reload
                if (!hadController) {
                    hadController = true;
                    return;
                }
                window.reloadAppSafely('service-worker-controller-change');
            });

            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                    window.musifySwRegistration = reg;
                    try { reg.update(); } catch(e){}

                    reg.addEventListener('updatefound', function() {
                        var newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        }
                    });
                    console.log('PWA SW Registered:', reg.scope);
                }).catch(function(err) {
                    console.error('PWA SW Register failed:', err);
                });
            });

            // Universal PWA Version Watcher: Check every 30s & on focus
            try {
                window.activeAppVersion = localStorage.getItem('musify_app_version') || null;
            } catch(e) {
                window.activeAppVersion = null;
            }

            window.checkPwaVersionUpdate = async function() {
                try {
                    // Do not interrupt if user is actively logging in or authenticating
                    if (window.musifyAuthInProgress || window._isReloadingApp) return;

                    var res = await fetch('/api/version?t=' + Date.now(), { cache: 'no-store' });
                    var data = await res.json();
                    if (!data || !data.version) return;

                    if (!window.activeAppVersion) {
                        window.activeAppVersion = data.version;
                        try {
                            localStorage.setItem('musify_app_version', data.version);
                            if (data.buildTimestamp) localStorage.setItem('musify_last_reloaded_build', String(data.buildTimestamp));
                        } catch(e){}
                        return;
                    }

                    var lastReloadedBuild = '';
                    try { lastReloadedBuild = localStorage.getItem('musify_last_reloaded_build') || ''; } catch(e){}

                    var isNewerVersion = (window.activeAppVersion !== data.version);
                    var isNewerBuild = data.buildTimestamp && (lastReloadedBuild !== String(data.buildTimestamp));
                    var shouldReload = isNewerVersion || (data.forceReload && isNewerBuild);

                    if (shouldReload) {
                        if (window.musifyAuthInProgress || window._isReloadingApp) return;
                        console.log('[PWA UPDATE] Newer version/build detected:', data.version, 'Current:', window.activeAppVersion);
                        
                        window.activeAppVersion = data.version;
                        try {
                            localStorage.setItem('musify_app_version', data.version);
                            if (data.buildTimestamp) localStorage.setItem('musify_last_reloaded_build', String(data.buildTimestamp));
                        } catch(e){}

                        if (window.musifySwRegistration) {
                            try { window.musifySwRegistration.update(); } catch(e){}
                        }
                        if (typeof showToast === 'function') {
                            showToast('🚀 Memperbarui MusifyStar ke ' + data.version + '...');
                        }

                        // Delay sedikit agar pengguna sempat melihat notifikasi update, lalu reload 1x
                        setTimeout(function() {
                            window.reloadAppSafely('pwa-version-bump');
                        }, 1200);
                    }
                } catch(e) {}
            };

            setInterval(window.checkPwaVersionUpdate, 30000);
            window.addEventListener('focus', function() {
                setTimeout(window.checkPwaVersionUpdate, 1000);
            });
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    window.checkPwaVersionUpdate();
                }
            });
        }
    </script>

        /* The Expanding Box Container */

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.95);

        /* 4-segment conic gradient on rotating square (Transcribed exactly from video) */
        .neon-box-card::before {
            content: '';
            position: absolute;
            inset: 50%;
            width: 170vmax;
            height: 170vmax;
            translate: -50% -50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg 36deg,
                #35eaff 36deg 48deg,
                transparent 48deg 126deg,
                #ff10de 126deg 138deg,
                transparent 138deg 216deg,
                #35eaff 216deg 228deg,
                transparent 228deg 306deg,
                #ff10de 306deg 318deg,
                transparent 318deg 360deg

            filter: blur(1px) drop-shadow(0 0 12px #35eaff);

        /* ===== SPLASH SCREEN - MONOCHROME ===== */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 45%, #1f2029 0%, #050507 70%);
            transform-origin: center center;
            will-change: transform, opacity;
            animation: splashEntranceZoomOut 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.3);
        }

        @keyframes splashEntranceZoomOut {
            0% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .splash-rings {
            position: relative;
            width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
        }
        .splash-rings span {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            animation: splashWave 2.8s cubic-bezier(.4,0,.2,1) infinite;
        }
        .splash-rings span:nth-child(2) { animation-delay: .7s; }
        .splash-rings span:nth-child(3) { animation-delay: 1.4s; }
        .splash-rings span:nth-child(4) { animation-delay: 2.1s; }

        @keyframes splashWave {
            0% { transform: scale(.3); opacity: 0; }
            15% { opacity: .7; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .splash-disc {
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 2px, transparent 7px);
            box-shadow: 0 0 60px rgba(255,255,255,0.1), inset 0 0 40px rgba(0,0,0,0.7);
            animation: splashSpin 7s linear infinite;
        }
        .splash-disc::before {
            content: '';
            position: absolute; inset: -10px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.2), rgba(255,255,255,0.4), rgba(255,255,255,0.2), transparent);
            animation: splashShimmer 3s linear infinite;
            filter: blur(15px); z-index: -1;
        }

        @keyframes splashSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes splashShimmer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* High-Performance Blurred Artwork Background for Player & Lyrics */
        .player-bg-container {
            position: absolute;
            inset: 0;

            z-index: 0;

            will-change: opacity, transform;
            transform: translateZ(0);

        .player-bg-glow {
            position: absolute;
            inset: -25%;
            z-index: 0;
            opacity: 0;
            mix-blend-mode: screen;
            filter: blur(34px);
            background-repeat: no-repeat;
            background-image:
                radial-gradient(circle at 22% 28%, var(--glow-c1, transparent) 0%, transparent 60%),
                radial-gradient(circle at 78% 35%, var(--glow-c2, transparent) 0%, transparent 60%),
                radial-gradient(circle at 42% 82%, var(--glow-c3, transparent) 0%, transparent 60%);
            background-size: 140% 140%;
            animation: glowDrift 9s ease-in-out infinite;
            will-change: transform;
            transition: opacity 0.6s ease;
            pointer-events: none;

        @keyframes glowDrift {
            0%   { transform: translate3d(0%, 0%, 0) scale(1) rotate(0deg); }

            40%  { transform: translate3d(-9%, 4%, 0) scale(0.92) rotate(-7deg); }
            60%  { transform: translate3d(5%, 9%, 0) scale(1.1) rotate(11deg); }
            80%  { transform: translate3d(-6%, -6%, 0) scale(0.95) rotate(-9deg); }
            100% { transform: translate3d(0%, 0%, 0) scale(1) rotate(0deg); }

            background: rgba(14, 15, 22, 0.96);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }
        .nav-icon-wrapper {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ===== Bottom Navigation Floating Capsule Dock (Transparent Glassmorphism) ===== */
        .magic-nav-dock {
            position: relative;
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            overflow: visible;
        }

        .magic-indicator {
            position: absolute;
            top: -12px;
            left: 4px;
            width: calc((100% - 8px) / 6);
            height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            pointer-events: none;
            z-index: 25;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
            will-change: transform;
        }

        .magic-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.5), 0 5px 14px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 26;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magic-circle-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #0b0c10;
        }

        .magic-circle-icon i,
        .magic-circle-icon svg {
            width: 17px;
            height: 17px;
            stroke-width: 2.3;
            stroke: #0b0c10;
        }

        .magic-indicator-label {
            font-size: 9.5px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 1.5px;
            letter-spacing: 0.01em;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }

        .magic-tab {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            z-index: 20;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            margin: 0;
        }

        .magic-tab-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.55);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.22s ease, color 0.22s ease !important;
        }

        .magic-tab-icon i,
        .magic-tab-icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.8;
        }

        .magic-tab:hover .magic-tab-icon {
            color: rgba(255, 255, 255, 0.9);
        }

        .magic-tab-label {
            display: none !important;
        }

        /* Active Tab State (inactive tab icon hides under the indicator circle) */
        .magic-tab.active .magic-tab-icon {
            opacity: 0;
            pointer-events: none;
        }

        /* ==================== TEMA NAV BAR VIP ==================== */
        /* 1. Liquid Glass */
        .theme-nav-liquid .magic-nav-dock {
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1.5px solid rgba(56, 189, 248, 0.4) !important;
            box-shadow: 0 10px 32px rgba(14, 165, 233, 0.3), 0 0 25px rgba(168, 85, 247, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
            backdrop-filter: blur(28px) !important;
            -webkit-backdrop-filter: blur(28px) !important;
        }
        .theme-nav-liquid .magic-circle {
            background: linear-gradient(135deg, #38bdf8, #818cf8) !important;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.85), 0 5px 15px rgba(0, 0, 0, 0.5) !important;
        }
        .theme-nav-liquid .magic-circle-icon i,
        .theme-nav-liquid .magic-circle-icon svg {
            stroke: #ffffff !important;
        }
        .theme-nav-liquid .magic-indicator-label {
            color: #38bdf8 !important;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.9) !important;
            font-weight: 800 !important;
        }

        /* 2. Spotify Emerald */
        .theme-nav-spotify .magic-nav-dock {
            background: #121212 !important;
            border: 1px solid #282828 !important;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 18px rgba(29, 185, 84, 0.2) !important;
            backdrop-filter: none !important;
        }
        .theme-nav-spotify .magic-circle {
            background: #1DB954 !important;
            box-shadow: 0 0 24px rgba(29, 185, 84, 0.9), 0 4px 14px rgba(0, 0, 0, 0.6) !important;
        }
        .theme-nav-spotify .magic-circle-icon i,
        .theme-nav-spotify .magic-circle-icon svg {
            stroke: #000000 !important;
        }
        .theme-nav-spotify .magic-indicator-label {
            color: #1DB954 !important;
            text-shadow: 0 0 8px rgba(29, 185, 84, 0.7) !important;
            font-weight: 800 !important;
        }

        /* 3. Apple Music Frosted Glass (iOS Style) */
        .theme-nav-apple .magic-nav-dock {
            background: rgba(22, 22, 28, 0.45) !important;
            border: 1px solid rgba(255, 255, 255, 0.24) !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.28) !important;
            backdrop-filter: blur(30px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(30px) saturate(190%) !important;
        }
        .theme-nav-apple .magic-circle {
            background: rgba(250, 45, 72, 0.88) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.35) !important;
            box-shadow: 0 0 24px rgba(250, 45, 72, 0.75), 0 4px 14px rgba(0, 0, 0, 0.4) !important;
        }
        .theme-nav-apple .magic-circle-icon i,
        .theme-nav-apple .magic-circle-icon svg {
            stroke: #ffffff !important;
        }
        .theme-nav-apple .magic-indicator-label {
            color: #fa2d48 !important;
            text-shadow: 0 0 8px rgba(250, 45, 72, 0.7) !important;
            font-weight: 800 !important;
        }
        .theme-nav-apple .magic-tab-icon {
            color: rgba(255, 255, 255, 0.75) !important;
        }
        .theme-nav-apple .magic-tab:hover .magic-tab-icon {
            color: #ffffff !important;
        }

        /* 4. Cyber Neon Glow */
        .theme-nav-neon .magic-nav-dock {
            background: rgba(10, 10, 18, 0.92) !important;
            border: 1.5px solid #00f0ff !important;
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.45), inset 0 0 15px rgba(255, 0, 128, 0.3) !important;
        }
        .theme-nav-neon .magic-circle {
            background: linear-gradient(135deg, #00f0ff, #ff007f) !important;
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.95), 0 0 18px rgba(255, 0, 128, 0.85) !important;
        }
        .theme-nav-neon .magic-circle-icon i,
        .theme-nav-neon .magic-circle-icon svg {
            stroke: #ffffff !important;
        }
        .theme-nav-neon .magic-indicator-label {
            color: #00f0ff !important;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff !important;
            font-weight: 800 !important;
        }

        /* 5. Modern Capsule (New Classic Gold) */
        .theme-nav-newclassic .magic-nav-dock {
            background: linear-gradient(180deg, #1d212c 0%, #0d0f16 100%) !important;
            border: 1.5px solid rgba(251, 191, 36, 0.4) !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.88), 0 0 18px rgba(251, 191, 36, 0.25) !important;
        }
        .theme-nav-newclassic .magic-circle {
            background: linear-gradient(135deg, #f59e0b, #fbbf24) !important;
            box-shadow: 0 0 22px rgba(245, 158, 11, 0.85), 0 4px 14px rgba(0, 0, 0, 0.6) !important;
        }
        .theme-nav-newclassic .magic-circle-icon i,
        .theme-nav-newclassic .magic-circle-icon svg {
            stroke: #000000 !important;
        }
        .theme-nav-newclassic .magic-indicator-label {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8) !important;
            font-weight: 800 !important;
        }

        /* Page Slide Animations */
        @keyframes slideInRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInLeft {
            0% { transform: translateX(-30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-right {
            animation: slideInRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .animate-slide-left {
            animation: slideInLeft 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Search Results & Cards Entrance Animations */
        @keyframes cardUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardLeft {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .animate-card-up {
            animation: cardUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .animate-card-left {
            animation: cardLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .transition-all, .transition, .transition-colors, .transition-opacity, .transition-transform {
            transition-duration: 500ms !important;
            transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
        }

        /* ===== Animated Delete Button (Video-Accurate Micro-Interaction) ===== */
        .anim-delete-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #7952f5;
            color: #ffffff;
            border: none;
            outline: none;
            border-radius: 9999px;
            padding: 0 16px;
            height: 38px;
            min-width: 96px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 18px rgba(121, 82, 245, 0.45);
            transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        min-width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        max-width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.2s ease,
                        transform 0.15s ease,
                        box-shadow 0.2s ease !important;
            overflow: visible;
        }

        .anim-delete-btn:hover {
            background: #6d42ec;
            box-shadow: 0 6px 22px rgba(121, 82, 245, 0.6);
        }

        .anim-delete-btn:active {
            transform: scale(0.96);
        }

        /* Mini version for song rows */
        .anim-delete-btn.anim-delete-mini {
            height: 34px !important;
            min-width: 34px !important;
            width: 34px !important;
            max-width: 34px !important;
            padding: 0 !important;
            border-radius: 50% !important;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .anim-delete-btn.anim-delete-mini:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .anim-delete-btn.anim-delete-mini.animating {
            background: #7952f5 !important;
            color: #ffffff !important;
            border-color: transparent !important;
            box-shadow: 0 4px 18px rgba(121, 82, 245, 0.5) !important;
        }

        /* Trash Icon */
        .anim-trash {
            position: relative;
            width: 15px;
            height: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 7px;
            flex-shrink: 0;
            z-index: 2;
            transition: transform 0.25s ease, opacity 0.2s ease, margin 0.25s ease !important;
        }

        .anim-delete-mini .anim-trash {
            margin-right: 0 !important;
        }

        .anim-trash-lid {
            position: absolute;
            top: 0px;
            left: 0;
            width: 15px;
            height: 5px;
            transform-origin: 2px 4px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        .anim-trash-box {
            position: absolute;
            top: 4px;
            left: 0.5px;
            width: 14px;
            height: 14px;
        }

        /* Text */
        .anim-delete-text {
            display: inline-block;
            white-space: nowrap;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease !important;
        }

        /* Progress SVG */
        .anim-delete-progress {
            position: absolute;
            inset: -3px;
            width: calc(100% + 6px);
            height: calc(100% + 6px);
            transform: rotate(-90deg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease !important;
            z-index: 3;
        }

        .anim-progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2.4;
        }

        .anim-progress-bar {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-dasharray: 88;
            stroke-dashoffset: 88;
            transition: stroke-dashoffset 0.82s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        /* Checkmark Icon */
        .anim-check-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.2);
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease !important;
            color: #ffffff;
            z-index: 4;
        }

        /* --- ANIMATION PHASES --- */
        /* Phase 1: Clicked -> Lid tilts up, text scales & drops in */
        .anim-delete-btn.animating {
            pointer-events: none !important;
        }

        .anim-delete-btn.animating .anim-trash {
            margin-right: 0 !important;
        }

        .anim-delete-btn.animating .anim-trash-lid {
            transform: rotate(-45deg) translateY(-2px);
        }

        .anim-delete-btn.animating .anim-delete-text {
            position: absolute;
            right: 14px;
            transform: translateX(-16px) translateY(4px) scale(0.2);
            opacity: 0;
            pointer-events: none;
        }

        /* Phase 2: Morph to circle, lid snaps shut, progress ring sweeps */
        .anim-delete-btn.morph-circle {
            width: 38px !important;
            min-width: 38px !important;
            max-width: 38px !important;
            height: 38px !important;
            padding: 0 !important;
            border-radius: 50% !important;
        }

        .anim-delete-btn.morph-circle .anim-delete-text {
            display: none !important;
        }

        .anim-delete-btn.morph-circle .anim-trash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0 !important;
        }

        .anim-delete-btn.morph-circle .anim-trash-lid {
            transform: rotate(0deg) translateY(0);
        }

        .anim-delete-btn.morph-circle .anim-delete-progress {
            opacity: 1;
        }

        .anim-delete-btn.progress-fill .anim-progress-bar {
            stroke-dashoffset: 0;
        }

        /* Phase 3: Checkmark success */
        .anim-delete-btn.success .anim-trash {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
        }

        .anim-delete-btn.success .anim-check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .anim-delete-btn.success {
            box-shadow: 0 4px 22px rgba(121, 82, 245, 0.75) !important;
        }

        /* Song Row Slide Out */
        .song-row-deleted {
            opacity: 0 !important;
            transform: translateX(-40px) scale(0.95) !important;
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            border-width: 0 !important;
            overflow: hidden !important;
            pointer-events: none !important;
            transition: all 0.38s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
    </style>
</head>

    <script>(function () {
  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('tab-hidden', document.hidden);
  });
  // Failsafe timer to hide splash screen and ensure Home view is rendered if anything delays
  setTimeout(function() {
      var vh = document.getElementById('view-home');
      if (vh && !vh.innerHTML.trim() && typeof Home !== 'undefined' && typeof Home.render === 'function') {
          try { Home.render(); Home.fetch(); } catch(e) {}
      }
      var sp = document.getElementById('splash-screen');
      if (sp && !sp.classList.contains('hide')) {
          sp.classList.add('hide');
          setTimeout(function() { if (sp && sp.parentNode) sp.parentNode.removeChild(sp); }, 700);
      }
  }, 2200);
})();</script>
